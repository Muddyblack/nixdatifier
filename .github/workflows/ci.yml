name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ruff, shellcheck, qmllint, qmlformat, unused QML code and manifests:
  # the same scripts/lint.sh that `make lint` runs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix develop --command bash scripts/lint.sh

  # QML interaction tests and the shell-helper tests, against the pinned Qt and
  # KDE modules from the dev shell.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test
        run: nix develop --command bash tests/run.sh

  # Everything that ships has to build, and a pull request gets the .plasmoid to try.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build packages
        run: nix build .#default .#nixdatifier .#hyprland .#tray --no-link --print-build-logs
      - name: Pack the plasmoid
        run: make pack
      - uses: actions/upload-artifact@v7
        with:
          name: plasmoid
          path: "*.plasmoid"
          if-no-files-found: error
